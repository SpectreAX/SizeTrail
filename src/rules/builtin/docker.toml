evidence = "Named and anonymous volumes hold application data inside the VM. SizeTrail reports the daemon category without treating it as a safe deletion target."
fixture_id = "docker-volumes"
preconditions = { process_not_running = ["Docker", "com.docker.hyperkit", "com.docker.virtualization"] }

[[rule]]
id = "docker.build_cache"
adapter = "docker"
title = "Docker build cache"
description = "Build cache object set reported by the Docker Desktop daemon."
subjects = [{ kind = "toolchain_object_set", object_set_id = "docker.build_cache" }]
os = ">=13.0"
mechanism = "generated"
recoverability = "rebuild_time_cost"
sensitivity = "low"
evidence = "BuildKit can reconstruct this cache on a later build. SizeTrail reports the daemon category and does not treat it as a host-file delete target."
fixture_id = "docker-build-cache"
preconditions = { process_not_running = ["Docker", "com.docker.hyperkit", "com.docker.virtualization"] }
