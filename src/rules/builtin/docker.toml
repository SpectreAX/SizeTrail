[[rule]]
id = "docker.virtual_disk"
adapter = "docker"
title = "Docker Desktop virtual disk"
description = "Host backing file for the Docker Desktop Linux VM."
subjects = [
  { kind = "filesystem_path", pattern = "~/Library/Containers/com.docker.docker/Data/vms/0/data/Docker.raw" },
  { kind = "filesystem_path", pattern = "~/Library/Containers/com.docker.docker/Data/vms/0/data/Docker.qcow2" },
  { kind = "filesystem_path", pattern = "~/Library/Containers/com.docker.docker/Data/com.docker.driver.amd64-linux/Docker.qcow2" },
]
os = ">=13.0"
mechanism = "vendor_managed"
recoverability = "unrecoverable"
sensitivity = "high"
evidence = "The file is the VM disk that holds images, containers, and volumes together. Measuring it does not make it a safe deletion target, and SizeTrail never treats the path as reclaimable store cleanup."
fixture_id = "docker-virtual-disk"
preconditions = { process_not_running = ["Docker", "com.docker.hyperkit", "com.docker.virtualization"] }

[[rule]]
id = "docker.images"
adapter = "docker"
title = "Docker images"
description = "Image object set reported by the Docker Desktop daemon."
subjects = [{ kind = "toolchain_object_set", object_set_id = "docker.images" }]
os = ">=13.0"
mechanism = "generated"
recoverability = "redownload_bandwidth"
sensitivity = "medium"
evidence = "The daemon can pull these images again when the original tags remain available. SizeTrail reports the vendor category and does not treat it as a host-file delete target."
fixture_id = "docker-images"
preconditions = { process_not_running = ["Docker", "com.docker.hyperkit", "com.docker.virtualization"] }

[[rule]]
id = "docker.containers"
adapter = "docker"
title = "Docker containers"
description = "Container object set reported by the Docker Desktop daemon."
subjects = [{ kind = "toolchain_object_set", object_set_id = "docker.containers" }]
os = ">=13.0"
mechanism = "user_owned"
recoverability = "unrecoverable"
sensitivity = "high"
evidence = "Containers hold writable runtime state inside the VM. SizeTrail reports the daemon category without treating it as a safe deletion target."
fixture_id = "docker-containers"
preconditions = { process_not_running = ["Docker", "com.docker.hyperkit", "com.docker.virtualization"] }

