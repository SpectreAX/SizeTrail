[[rule]]
id = "homebrew.cache_downloads"
adapter = "homebrew"
title = "Homebrew download cache"
description = "Downloaded source archives and bottles retained by Homebrew."
paths = ["~/Library/Caches/Homebrew/downloads"]
os = ">=13.0"
mechanism = "generated"
recoverability = "redownload_bandwidth"
sensitivity = "low"
evidence = "Homebrew can download these artifacts again; recovery consumes network bandwidth and may depend on upstream availability."
fixture_id = "homebrew-cache-downloads"
preconditions = { process_not_running = [] }

