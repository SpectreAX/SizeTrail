[[rule]]
id = "homebrew.logs"
adapter = "homebrew"
title = "Homebrew build logs"
description = "Logs retained from Homebrew source builds."
paths = ["~/Library/Logs/Homebrew"]
os = ">=13.0"
mechanism = "user_owned"
recoverability = "unrecoverable"
sensitivity = "medium"
evidence = "These logs are user state, not a cache: a failed build log cannot be regenerated after the build has ended."
fixture_id = "homebrew-logs"
preconditions = { process_not_running = [] }

[[rule]]
id = "homebrew.cellar"
adapter = "homebrew"
title = "Homebrew installed formula kegs"
description = "Versioned formula installations grouped by rack and keg."
paths = ["$CELLAR/*/*"]
os = ">=13.0"
mechanism = "vendor_managed"
recoverability = "redownload_bandwidth"
sensitivity = "medium"
evidence = "The Cellar contains installed software, not a cache; SizeTrail reports each keg without asserting removal safety."
fixture_id = "homebrew-cellar"
preconditions = { process_not_running = [] }

[[rule]]
id = "homebrew.caskroom"
adapter = "homebrew"
title = "Homebrew cask metadata"
description = "Versioned cask installation records retained under the Homebrew prefix."
paths = ["$PREFIX/Caskroom/*"]
os = ">=13.0"
mechanism = "vendor_managed"
recoverability = "redownload_bandwidth"
sensitivity = "medium"
evidence = "Homebrew owns Caskroom records; linked application artifacts can live outside the prefix and are outside this measurement."
fixture_id = "homebrew-caskroom"
preconditions = { process_not_running = [] }

[[rule]]
id = "homebrew.taps"
adapter = "homebrew"
title = "Homebrew tap repositories"
description = "Formula and cask definitions checked out for configured taps."
paths = ["$PREFIX/Library/Taps/*/*"]
os = ">=13.0"
mechanism = "generated"
recoverability = "redownload_bandwidth"
sensitivity = "low"
evidence = "Homebrew can fetch configured tap repositories again; local uncommitted edits are not classified as safely recoverable."
fixture_id = "homebrew-taps"
preconditions = { process_not_running = [] }
