name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  matrix:
    name: Define verified-platform matrix
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.platforms.outputs.runtime }}
    steps:
      - uses: actions/checkout@v5
      - id: platforms
        run: echo "runtime=$(jq -c '{include:.runtime_lanes}' ci/platforms.json)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.label }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.runtime) }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --check

      - name: Clippy and zero-write API gate
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint suppression boundaries
        run: |
          bash scripts/check-policy-boundary.sh clippy::disallowed_methods - src
          bash scripts/check-policy-boundary.sh clippy::disallowed_types src/policy.rs src clippy::style clippy::all clippy::disallowed_type warnings
          bash scripts/check-policy-boundary.sh unsafe_code src/fsx/sys.rs src warnings

      - name: Truth-contract claim patterns
        run: bash scripts/check-claim-patterns.sh

      - name: Tests
        run: cargo test --locked --all -- --nocapture

      - name: Fixture-generated public documentation
        run: |
          cargo test --locked --test generate_docs -- --ignored
          bash scripts/check-quantitative-docs.sh
          bash scripts/check-generated-docs.sh

      - name: Native release build
        run: cargo build --locked --release

      - name: Report selected simctl wrapper evidence
        run: |
          developer_dir="$(xcode-select -p)"
          simctl_wrapper="$developer_dir/usr/bin/simctl"
          printf 'developer_dir=%s\n' "$developer_dir"
          xcodebuild -version
          file "$simctl_wrapper"
          shasum -a 256 "$simctl_wrapper"
          sed -n '1,40p' "$simctl_wrapper"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/Info.plist

      - name: System-call zero-write sandbox
        run: bash scripts/check-zero-write-sandbox.sh target/release/sizetrail

      - name: Build release architectures
        if: matrix.release_build
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Mach-O minimum macOS gate
        if: matrix.release_build
        run: |
          bash scripts/check-minimum-macos.sh target/aarch64-apple-darwin/release/sizetrail arm64
          bash scripts/check-minimum-macos.sh target/x86_64-apple-darwin/release/sizetrail x86_64

      - name: Record Xcode fixture benchmark
        if: matrix.benchmark
        run: bash scripts/benchmark-xcode-fixture.sh

      - name: Publish Xcode fixture benchmark
        if: matrix.benchmark
        uses: actions/upload-artifact@v4
        with:
          name: xcode-fixture-benchmark-${{ matrix.runner }}
          path: artifacts/xcode-fixture-benchmark.json
          if-no-files-found: error

      - name: Install dependency policy tools
        if: matrix.policy
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: Dependency policy
        if: matrix.policy
        run: |
          cargo deny --locked check
          cargo audit --file Cargo.lock
