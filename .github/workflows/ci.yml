name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "13.0"

jobs:
  matrix:
    name: Define verified-platform matrix
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.platforms.outputs.runtime }}
      real_environment: ${{ steps.platforms.outputs.real_environment }}
    steps:
      - uses: actions/checkout@v5
      - id: platforms
        run: |
          echo "runtime=$(jq -c '{include:.runtime_lanes}' ci/platforms.json)" >> "$GITHUB_OUTPUT"
          echo "real_environment=$(jq -c '{include:.real_environment_lanes}' ci/platforms.json)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.label }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.runtime) }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy,rustfmt
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Locked dependency graph
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Format
        run: cargo fmt --check

      - name: Clippy and zero-write API gate
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Lint suppression boundaries
        run: |
          bash scripts/check-policy-boundary.sh clippy::disallowed_methods - src
          bash scripts/check-policy-boundary.sh clippy::disallowed_types src/policy.rs src clippy::style clippy::all clippy::disallowed_type warnings
          bash scripts/check-policy-boundary.sh unsafe_code src/fsx/sys.rs src warnings

      - name: Truth-contract claim patterns
        run: bash scripts/check-claim-patterns.sh

      - name: Tests
        run: cargo test --locked --all -- --nocapture

      - name: Fixture-generated public documentation
        run: |
          cargo test --locked --test generate_docs -- --ignored
          bash scripts/check-quantitative-docs.sh
          bash scripts/check-generated-docs.sh

      - name: Native release build
        run: cargo build --locked --release

      - name: Report selected simctl wrapper evidence
        run: |
          developer_dir="$(xcode-select -p)"
          simctl_wrapper="$developer_dir/usr/bin/simctl"
          printf 'developer_dir=%s\n' "$developer_dir"
          xcodebuild -version
          file "$simctl_wrapper"
          shasum -a 256 "$simctl_wrapper"
          sed -n '1,40p' "$simctl_wrapper"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/Resources/Info.plist

      - name: System-call zero-write sandbox
        run: bash scripts/check-zero-write-sandbox.sh target/release/sizetrail

      - name: Build release architectures
        if: matrix.release_build
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin

      - name: Mach-O minimum macOS gate
        if: matrix.release_build
        run: |
          bash scripts/check-minimum-macos.sh target/aarch64-apple-darwin/release/sizetrail arm64
          bash scripts/check-minimum-macos.sh target/x86_64-apple-darwin/release/sizetrail x86_64

      - name: Record Xcode fixture benchmark
        if: matrix.benchmark
        run: bash scripts/benchmark-xcode-fixture.sh

      - name: Publish Xcode fixture benchmark
        if: matrix.benchmark
        uses: actions/upload-artifact@v4
        with:
          name: xcode-fixture-benchmark-${{ matrix.runner }}
          path: artifacts/xcode-fixture-benchmark.json
          if-no-files-found: error

      - name: Install dependency policy tools
        if: matrix.policy
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: Dependency policy
        if: matrix.policy
        run: |
          cargo deny --locked check
          cargo audit --file Cargo.lock

  # Q44: evidence from directories this project did not create. Deliberately non-blocking --
  # hosted images rotate Xcode versions constantly, and if this lane could turn main red the
  # cheapest fix under that pressure would be loosening the exact-version gate. CI pressure must
  # never be able to erode a safety gate.
  real-environment:
    name: ${{ matrix.label }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.real_environment) }}

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Report the real toolchain under test
        run: |
          xcode-select -p
          xcodebuild -version
          for prefix in /opt/homebrew /usr/local; do
            if [ -e "$prefix/bin/brew" ] && { [ -d "$prefix/Cellar" ] || [ -d "$prefix/Caskroom" ]; }; then
              echo "homebrew_prefix=$prefix"
              ls -ld "$prefix/bin/brew" "$prefix/Cellar" "$prefix/Caskroom" 2>/dev/null || true
              sed -n '1p' "$prefix/.git/HEAD" 2>/dev/null || true
            fi
          done
          # The adapter gates on this, and a hosted counterexample already showed it is not a
          # sufficient readiness signal (Q43), so record the raw status rather than inferring it.
          status=0; xcodebuild -checkFirstLaunchStatus || status=$?
          echo "checkFirstLaunchStatus=$status"
          xcrun simctl list runtimes || true
          ls -1 "$HOME/Library/Developer/CoreSimulator/Devices" 2>/dev/null | head -20 || true

      # DerivedData and Archives are empty on a fresh runner. iOS DeviceSupport can never be
      # constructed here because it only comes from connecting a physical device (Q44); it stays
      # fixture-only, permanently.
      - name: Populate DerivedData with a throwaway build
        run: |
          work="$(mktemp -d)"
          cd "$work"
          mkdir -p Throwaway/Sources/Throwaway
          cat > Throwaway/Package.swift <<'SWIFT'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(name: "Throwaway", targets: [.target(name: "Throwaway")])
          SWIFT
          echo 'public func throwaway() -> Int { 1 }' > Throwaway/Sources/Throwaway/Throwaway.swift
          cd Throwaway
          # The scheme xcodebuild synthesises for a package is not reliably named after the
          # package across Xcode versions, so discover it instead of guessing.
          scheme="$(xcodebuild -list -json 2>/dev/null | jq -r '(.workspace // .project).schemes[0] // empty')"
          [ -n "$scheme" ] || scheme=Throwaway
          echo "scheme=$scheme"
          xcodebuild -scheme "$scheme" -destination 'generic/platform=macOS' build || true
          du -sh "$HOME/Library/Developer/Xcode/DerivedData" 2>/dev/null || true
          ls -1 "$HOME/Library/Developer/Xcode/DerivedData" 2>/dev/null || true

      # What the product actually attributed, printed unconditionally. A lane that only reports
      # pass/fail cannot show which stores were reported versus explained by a typed gap, and
      # "at least one finding" would stay green while a whole category went missing.
      - name: What was attributed and what was declared missing
        run: |
          cargo build --locked --release
          ./target/release/sizetrail scan --json > /tmp/real-scan.json || true
          echo '--- rule_id x normalized_path ---'
          jq -r '.payload.findings[] | "\(.rule_id)\t\(.normalized_path)"' /tmp/real-scan.json
          echo '--- regions ---'
          jq -c '.payload.regions' /tmp/real-scan.json
          echo '--- coverage_gaps ---'
          jq -c '.payload.coverage_gaps' /tmp/real-scan.json
          echo '--- simulator directories present on disk ---'
          ls -1 "$HOME/Library/Developer/CoreSimulator/Devices" 2>/dev/null | wc -l

      - name: Real-environment attribution and version-gate degradation
        run: cargo test --locked --test real_environment -- --ignored --nocapture
