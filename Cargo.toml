[package]
name = "sizetrail"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = "4.5"
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.23"
xattr = "1.6"

[lints.rust]
unsafe_code = "deny"
